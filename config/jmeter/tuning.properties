# ===== Result file: only what is needed (less memory + disk) =====
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.samplerData=false
jmeter.save.saveservice.requestHeaders=false
jmeter.save.saveservice.responseHeaders=false
jmeter.save.saveservice.url=true
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.timestamp_format=ms
jmeter.save.saveservice.print_field_names=true
jmeter.save.saveservice.assertion_results_failure_message=true
jmeter.save.saveservice.connect_time=true
jmeter.save.saveservice.sent_bytes=true
jmeter.save.saveservice.idle_time=true

# ===== HTTP client =====
httpclient4.retrycount=0
httpclient4.request_sent_retry_enabled=false
httpclient.reset_state_on_thread_group_iteration=true
httpsampler.ignore_failed_embedded_resources=true
httpclient4.time_to_live=60000
httpclient4.idletimeout=30000
httpclient4.validate_after_inactivity=2000
# Better TLS-handshake behaviour with many users
https.sessioncontext.shared=false
https.use.cached.ssl.context=true

# ===== Console summariser + backend =====
summariser.name=summary
summariser.interval=30
summariser.log=true
summariser.out=true
backend_metrics_window=100
backend_metrics_large_window=5000

# ===== Distributed mode: keep controller light =====
# StrippedAsynch = workers send sample results asynchronously, without response bodies
mode=StrippedAsynch
asynch.batch.queue.size=100
server.rmi.ssl.disable=true
server.rmi.localport=50000
client.rmi.localport=7000

# ===== HTML report =====
jmeter.reportgenerator.report_title=OMP Performance Report
jmeter.reportgenerator.overall_granularity=60000
jmeter.reportgenerator.apdex_satisfied_threshold=1500
jmeter.reportgenerator.apdex_tolerated_threshold=6000
jmeter.reportgenerator.exporter.html.series_filter=^(TX|AUTH|PROTO).*(-success|-failure)?$

# ===== Misc =====
jmeter.laf=CrossPlatform
