# QA environment - replace hosts. Secrets are NEVER stored here:
#   OAUTH_CLIENT_SECRET, JWT_SECRET are read from the environment (Jenkins/GitLab/K8s secrets)
env=qa
host=qa.omp.example.com
port=443
protocol=https
auth_mode=oauth2
oauth_client_id=omp-perf-client
influx_url=http://influxdb.monitoring.svc:8086/write?db=jmeter
