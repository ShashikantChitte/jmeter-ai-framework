# Dedicated performance environment (production-like) - replace hosts
env=perf
host=perf.omp.example.com
port=443
protocol=https
auth_mode=oauth2
oauth_client_id=omp-perf-client
influx_url=http://influxdb.monitoring.svc:8086/write?db=jmeter
jdbc_url=jdbc:postgresql://perf-db.omp.example.com:5432/omp
fail_fast=true
