# Example only - create the real secret from your vault / CI:
#   kubectl -n jmeter create secret generic omp-secrets --from-literal=OAUTH_CLIENT_SECRET=... --from-literal=JWT_SECRET=...
apiVersion: v1
kind: Secret
metadata: { name: omp-secrets, namespace: jmeter }
type: Opaque
stringData: { OAUTH_CLIENT_SECRET: changeme, JWT_SECRET: changeme }
