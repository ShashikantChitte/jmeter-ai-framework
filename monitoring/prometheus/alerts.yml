groups:
  - name: load-generator-health
    rules:
      - alert: LoadGeneratorCpuHigh
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 80
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Generator CPU > 80% - results may be distorted, add workers" }
      - alert: JMeterHeapHigh
        expr: jvm_memory_bytes_used{area="heap"} / jvm_memory_bytes_max{area="heap"} > 0.85
        for: 3m
        labels: { severity: warning }
        annotations: { summary: "JMeter heap > 85% - raise -Xmx or reduce stored data" }
      - alert: JMeterGcOverhead
        expr: rate(jvm_gc_collection_seconds_sum[1m]) > 0.10
        for: 3m
        labels: { severity: warning }
        annotations: { summary: "JMeter spends >10% of time in GC" }
      - alert: GeneratorNetworkSaturated
        expr: rate(node_network_transmit_bytes_total{device!="lo"}[1m]) > 100e6
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Generator network >100 MB/s - check NIC / bandwidth limit" }
