global: { scrape_interval: 5s, evaluation_interval: 15s }
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: node                 # CPU, memory, disk, network of hosts / load generators
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: cadvisor             # per-container CPU / memory / network
    static_configs: [{ targets: ["cadvisor:8080"] }]
  - job_name: jmeter-jvm           # JMeter JVM: heap, GC, threads, CPU (JMX exporter agent)
    static_configs: [{ targets: ["jmeter:9404"] }]
  - job_name: jmeter-metrics       # JMeter results via Graphite Backend Listener
    static_configs: [{ targets: ["graphite-exporter:9108"] }]
  # Kubernetes: scrape every JMeter worker pod (annotation prometheus.io/scrape=true) - uncomment on a cluster
  # - job_name: jmeter-workers
  #   kubernetes_sd_configs: [{ role: pod, namespaces: { names: [jmeter] } }]
  #   relabel_configs:
  #     - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true" }
  #     - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
